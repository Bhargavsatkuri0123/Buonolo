# WebSocket upgrade support for the /ws gateway.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# CloudFront/ALB terminates TLS and forwards plain HTTP to this instance, so
# $scheme here is always "http". CloudFront does NOT send the standard
# X-Forwarded-Proto header by default — it sends its own
# CloudFront-Forwarded-Proto — so prefer that, fall back to X-Forwarded-Proto
# (e.g. an ALB in front instead), then finally $scheme for direct/local access.
# In local/plain dev neither header is present, so this simply resolves to
# $scheme, same as before this map existed.
map $http_x_forwarded_proto $forwarded_proto_xfp {
  default $http_x_forwarded_proto;
  ''      $scheme;
}
map $http_cloudfront_forwarded_proto $forwarded_proto {
  default $http_cloudfront_forwarded_proto;
  ''      $forwarded_proto_xfp;
}
