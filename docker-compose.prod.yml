services:
  backend:
    image: 940127591852.dkr.ecr.eu-west-2.amazonaws.com/buonolo:backend-${IMAGE_TAG:-latest}

  # Gates the QA site behind Microsoft Entra ID SSO; nginx (built from
  # nginx.qa.conf for this deploy) sends every request through it first.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://login.microsoftonline.com/${AZURE_TENANT_ID:?AZURE_TENANT_ID must be set}/v2.0
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?OAUTH2_PROXY_CLIENT_ID must be set}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?OAUTH2_PROXY_CLIENT_SECRET must be set}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?OAUTH2_PROXY_COOKIE_SECRET must be set}
      OAUTH2_PROXY_EMAIL_DOMAINS: pearwavetechnologiesltd.com
      OAUTH2_PROXY_REDIRECT_URL: ${QA_SITE_URL:-https://qa.buonolo.com}/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-true}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://200
      OAUTH2_PROXY_SCOPE: "openid email profile"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_WHITELIST_DOMAIN: qa.buonolo.com
      # Azure AD's id_token pushes the session past the 4KB single-cookie
      # limit, so oauth2-proxy splits it across multiple Set-Cookie headers;
      # if any get dropped in transit the session silently fails to
      # reassemble. Redis-backed storage keeps it to one small cookie.
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    # No healthcheck: the official image ships no shell/wget/curl to run one
    # with, so nginx below only waits for this container to start, not for a
    # (currently impossible) health check to pass.

  nginx:
    image: 940127591852.dkr.ecr.eu-west-2.amazonaws.com/buonolo:nginx-${IMAGE_TAG:-latest}
    depends_on:
      oauth2-proxy:
        condition: service_started
