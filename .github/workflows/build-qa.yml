name: QA build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to promote to QA
        required: false
        default: main

permissions:
  id-token: write
  contents: read

jobs:
  qa:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: qa
      ref: ${{ inputs.ref }}
    secrets: inherit
